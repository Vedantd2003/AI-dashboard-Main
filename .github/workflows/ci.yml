name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run build -w @alphapulse/shared && npm run typecheck

      - name: Unit and integration tests
        # mongodb-memory-server downloads its own mongod in CI.
        run: npm test

      - name: Production builds
        run: npm run build:api && API_BASE_URL=http://localhost:4000 npm run build:web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

      - name: End-to-end (fixture providers, real MongoDB)
        run: |
          (cd apps/api && MONGODB_URI=mongodb://127.0.0.1:27017/alphapulse_e2e PORT=4000 npx tsx test/fixture-server.ts > ../../fixture.log 2>&1 &)
          (cd apps/web && npx next start -p 3000 > ../../web.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:4000/api/v1/health http://localhost:3000/
          cd apps/web && npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            fixture.log
            web.log

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high
